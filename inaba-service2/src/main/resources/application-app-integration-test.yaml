# 統合テストは並列で実行されるため、エフェメラルポートに自動で割り当てる設定にする
server.port: 0
grpc.server.port: 0

spring:
  # 最低限のドライバーのみ指定し、あとは@ServiceConnectionで設定してもらう
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson

logging:
  level:
    jp.inaba: DEBUG
    org.jooq.tools.LoggerListener: DEBUG